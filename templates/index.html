<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if version_info.disable_cache %}
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    {% endif %}
    <title>JavJaeger</title>
    <link rel="stylesheet" href="/static/app.css?v={{ version_info.asset_version | default(version_info.version) }}">
    <!-- React & ReactDOM -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <!-- Inject Version Information -->
    <script>
        window.versionInfo = {{ version_info | tojson }};
    </script>

    <!-- React Application -->
    <script src="/static/app.js?v={{ version_info.asset_version | default(version_info.version) }}" defer></script>
</body>

</html>
